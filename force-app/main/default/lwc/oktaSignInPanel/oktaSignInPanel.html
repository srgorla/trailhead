<template>
  <section
    class="portal"
    style={brandStyle}
    aria-label="Customer portal sign-in preview"
  >
    <div class="portal-intro">
      <span class="eyebrow">CUSTOMER PORTAL</span>
      <h1>{heading}</h1>
      <p class="intro-copy">
        One place to connect, collaborate, and get the support you need.
      </p>
      <div class="intro-note">
        <span class="note-dot" aria-hidden="true"></span>
        <span>Your sign-in experience, powered by Okta.</span>
      </div>
    </div>
    <div class="signin-panel">
      <div class="preview-notice" role="note">
        <span class="preview-label">PREVIEW</span>
        <p>Sign-in preview. Authentication is not connected.</p>
      </div>
      <c-okta-widget-host brand-color={safeBrandColor}></c-okta-widget-host>
      <p class="signin-caption">Sign-in is disabled for this preview.</p>
    </div>
  </section>
</template>
